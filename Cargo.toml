[package]
name = "lucyd-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for Lucyd prediction markets"
license = "MIT"
repository = "https://github.com/lucyd-trade/mcp-server"

[[bin]]
name = "lucyd-mcp"
path = "src/main.rs"

[dependencies]
alloy = { version = "2", default-features = false, features = ["contract", "network", "provider-http", "reqwest-rustls-tls", "rpc-types", "signer-local", "sol-types", "std"] }
anyhow = "1"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
